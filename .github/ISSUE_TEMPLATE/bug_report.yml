name: Bug report
description: Report a reproducible simulation, training, or ROS 2 problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the command, relevant parameters, and terminal output.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Ubuntu, ROS 2, Gazebo, GPU, and driver versions.
    validations:
      required: true

