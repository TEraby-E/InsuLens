# InsuLens YOLOv10s P2 + Coordinate Attention experiment model.
# YOLOv10 remains anchor-free; P2 adds stride-4 features for small objects.
nc: 80
scales:
  s: [0.33, 0.50, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, CoordAtt, []]           # 3-P2/4
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 3, C2f, [256, True]]
  - [-1, 1, CoordAtt, []]           # 6-P3/8
  - [-1, 1, SCDown, [512, 3, 2]]
  - [-1, 3, C2f, [512, True]]
  - [-1, 1, SCDown, [1024, 3, 2]]
  - [-1, 3, C2fCIB, [1024, True, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 1, PSA, [1024]]

head:
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]             # 15-P4/16
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]             # 18-P3/8
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 3], 1, Concat, [1]]
  - [-1, 3, C2f, [128]]             # 21-P2/4
  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 18], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]             # 24-P3/8
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 15], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]             # 27-P4/16
  - [-1, 1, SCDown, [512, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 3, C2fCIB, [1024, True, True]] # 30-P5/32
  - [[21, 24, 27, 30], 1, v10Detect, [nc]]
